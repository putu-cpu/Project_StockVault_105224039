services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  app:
    image: stokvault:sec-0.2
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      org.opencontainers.image.version: "sec-0.2"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host db in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      STOKVAULT_SECRET_KEY: ${STOKVAULT_SECRET_KEY:?Set STOKVAULT_SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    internal: true

volumes:
  postgres_data:
